pipeline{
  agent any
  tools{
    jdk 'jdk17'
  }
  environnement {
    SCANNER_HOME= tool 'sonar-scanner'
  }
  stages {
    stage('Git Checkout') {
      steps { 
        git ''
        }
      }
    stage('OWASP') {
      steps {
      dependencyCheck additionalArgument: ' --scan ./ ', odcInstallation: 'DC'
        dependencyCheckPublisher pattern: '**dependency-check-report.xml'
        }
      }
      stage('Trivi Fs Scan') {
        steps {
          sh " trivy fs ."
          }
        }
       stage('Sonarqube Analysis') {
        steps {
          sh ***$SCANNER_HOME/bin/sonar-scanner -Dsonar.projetName=Python-Webbap \
          -Dsonar.projetKey=Python-Webapp***          
          }
        }
      }
      
